
name: IQ AI Analyzer Scheduled

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: iq-ai-analyzer-runner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Clone Kronos
        run: |
          if [ ! -d kronos_repo ]; then
            git clone --depth 1 https://github.com/shiyu-coder/Kronos.git kronos_repo
          fi

      - name: Restore DB and Models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/models_v8

          if gh release view state-backup >/dev/null 2>&1; then
            gh release download state-backup \
              -p backup.tar.gz -D . || true

            if [ -f backup.tar.gz ]; then
              tar -xzf backup.tar.gz -C data
              echo "Backup restored"
            fi
          else
            echo "No previous backup found"
          fi

      - name: Run Analyzer Engine
        env:
          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MAX_RUNTIME_SEC: "17100"
          ENABLE_KRONOS: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python -u engine.py

      - name: Save DB and Models
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/models_v8
          tar -czf backup.tar.gz -C data .

          if ! gh release view state-backup >/dev/null 2>&1; then
            gh release create state-backup \
              --title "Analyzer State Backup" \
              --notes "Automatic database and model backup"
          fi

          gh release upload state-backup backup.tar.gz --clobber
          echo "Backup uploaded"
